name: Refresh water data

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency: refresh-data

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install osmium

      - name: Download Greece extract (Geofabrik)
        run: |
          curl -fL --retry 3 -A "greece-water-map (github.com/${{ github.repository }})" \
            -o greece.osm.pbf https://download.geofabrik.de/europe/greece-latest.osm.pbf
          test "$(stat -c%s greece.osm.pbf)" -gt 200000000

      - name: Build new data file
        run: python tools/extract.py greece.osm.pbf new.geojson

      - name: Sanity check and compare with current data
        id: cmp
        run: |
          python - <<'PY'
          import json, os
          new = json.load(open("new.geojson"))
          old = json.load(open("water.geojson"))
          n = len(new["features"])
          assert 3000 < n < 20000, f"unexpected feature count: {n}"
          changed = new["features"] != old["features"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          print(n, "features; changed:", changed)
          PY

      - name: Commit updated data
        if: steps.cmp.outputs.changed == 'true'
        run: |
          mv new.geojson water.geojson
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water.geojson
          git commit -m "Refresh OSM water data"
          git push
