name: Refresh water data

on:
  schedule:
    - cron: "17 4 * * 1"   # every Monday 04:17 UTC
  workflow_dispatch:

permissions: {}            # nothing by default; the job below asks only for what it needs

concurrency: refresh-data

env:
  SITE_URL: https://bestcodereverforsure.github.io/greece-water-map/   # change this line when the site gets its own domain
  EXTRACT_URL: https://download.geofabrik.de/europe/greece-latest.osm.pbf
  MAX_DROP: "0.15"         # refuse to publish if more than 15% of the points disappear in one week

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write      # to commit the refreshed data and pages
    steps:
      # Actions are pinned to exact commits (v4.4.0 and v5.6.0), so a moved tag can't change what runs here.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - run: pip install osmium==4.3.1 shapely==2.1.2 pytest==9.1.1

      - name: Download Greece extract (Geofabrik) and verify its checksum
        run: |
          curl -fL --retry 3 -A "greece-water-map (github.com/${{ github.repository }})" -o greece.osm.pbf "$EXTRACT_URL"
          curl -fL --retry 3 -A "greece-water-map (github.com/${{ github.repository }})" -o greece.osm.pbf.md5 "$EXTRACT_URL.md5"
          echo "$(cut -d' ' -f1 greece.osm.pbf.md5)  greece.osm.pbf" | md5sum -c -
          test "$(stat -c%s greece.osm.pbf)" -gt 200000000

      - name: Build new data file
        run: python tools/extract.py greece.osm.pbf new.geojson

      - name: Sanity check and compare with current data
        id: cmp
        run: |
          python - <<'PY'
          import json, os
          new = json.load(open("new.geojson"))
          old = json.load(open("water.geojson"))
          n, o = len(new["features"]), len(old["features"])
          assert 3000 < n < 20000, f"unexpected feature count: {n}"
          assert n >= o * (1 - float(os.environ["MAX_DROP"])), f"too many points disappeared: {o} -> {n}; check the data before publishing"
          changed = new["features"] != old["features"]
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"changed={'true' if changed else 'false'}\n")
          print(f"{o} -> {n} features; changed: {changed}")
          PY

      - name: Use the new data
        if: steps.cmp.outputs.changed == 'true'
        run: mv new.geojson water.geojson

      - name: Rebuild area pages
        run: python tools/build_pages.py water.geojson tools/areas.geojson . "$SITE_URL"

      - name: Test everything before publishing
        run: python -m pytest -q tests

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add water.geojson vryses en sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh OSM data and area pages" && git push; fi
