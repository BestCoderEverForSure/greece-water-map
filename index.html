<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Πόσιμο νερό · Drinking water Greece</title>
<meta name="description" content="Χάρτης με βρύσες και πηγές πόσιμου νερού στην Ελλάδα. Map of drinking fountains, taps and springs in Greece.">
<meta name="theme-color" content="#1478d4">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Cpath d=%27M32 4C21 20 14 29 14 40a18 18 0 0 0 36 0C50 29 43 20 32 4z%27 fill=%27%231478d4%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
  :root {
    --bg: #ffffff; --fg: #14202b; --muted: #5b6b7a; --line: #d9e1e8; --card: #ffffff;
    --fountain: #1478d4; --tap: #0e9384; --spring: #4f9a2a; --accent: #1478d4;
    --shadow: 0 2px 10px rgba(10, 30, 50, .18);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1a24; --fg: #e8eef3; --muted: #9db0c1; --line: #263644; --card: #16232f; --shadow: 0 2px 12px rgba(0,0,0,.5); }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--fg); overflow: hidden; }
  #map { position: absolute; inset: 0; }
  .top { position: absolute; top: 0; left: 0; right: 0; padding: max(10px, env(safe-area-inset-top)) 12px 0; display: flex; flex-direction: column; gap: 8px; pointer-events: none; z-index: 2; }
  .top > * { pointer-events: auto; }
  .bar { display: flex; gap: 8px; align-items: center; }
  .title { background: var(--card); border-radius: 12px; padding: 9px 12px; box-shadow: var(--shadow); font-weight: 650; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  @media (max-width: 480px) { .title small { display: none; } }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icon { background: var(--card); border: 0; border-radius: 12px; height: 38px; min-width: 38px; padding: 0 12px; box-shadow: var(--shadow); font-weight: 600; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid var(--line); border-radius: 999px; padding: 6px 12px; box-shadow: var(--shadow); }
  .chip i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .chip[aria-pressed="false"] { opacity: .5; }
  .chip[aria-pressed="false"] i { background: var(--muted) !important; }
  .chip.city { background: color-mix(in srgb, var(--accent) 12%, var(--card)); border-color: transparent; font-weight: 600; }
  .fab { position: absolute; right: 10px; bottom: 150px; z-index: 2; display: flex; align-items: center; gap: 6px; background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 10px 14px; box-shadow: var(--shadow); font-weight: 600; text-decoration: none; }
  .fab:hover { filter: brightness(1.08); }
  .nudge { align-self: flex-start; display: none; align-items: center; gap: 8px; background: var(--card); border-radius: 12px; padding: 7px 8px 7px 12px; box-shadow: var(--shadow); font-size: 13px; }
  .nudge.show { display: flex; }
  .nudge button { border: 0; border-radius: 8px; background: var(--accent); color: #fff; padding: 4px 10px; font-weight: 600; }
  .pop .dir { display: inline-block; margin-top: 8px; background: var(--accent); color: #fff !important; text-decoration: none; padding: 6px 12px; border-radius: 8px; font-weight: 600; font-size: 13px; }
  .rctl { padding: 0 16px 8px; font-size: 13px; }
  .rctl[hidden] { display: none; }
  .rsum { font-weight: 600; margin-bottom: 2px; }
  .rnote { color: var(--muted); margin-bottom: 6px; }
  .rbtns { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rbtns button { border: 1.5px solid var(--line); background: none; border-radius: 999px; padding: 3px 10px; }
  .rbtns button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .rbtns .clear { margin-left: auto; }
  body.drag::after { content: "GPX"; position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; font-size: 42px; font-weight: 700; color: #fff; background: rgba(20,120,212,.55); }
  .sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--card); border-radius: 18px 18px 0 0; box-shadow: 0 -2px 14px rgba(0,0,0,.2); z-index: 3; max-height: 55%; display: flex; flex-direction: column; transform: translateY(calc(100% - 46px)); transition: transform .25s ease; padding-bottom: env(safe-area-inset-bottom); }
  .sheet.open { transform: none; }
  .grab { border: 0; background: none; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; width: 100%; font-weight: 600; }
  .grab::before { content: ""; position: absolute; top: 6px; left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--line); }
  .list { overflow-y: auto; margin: 0; padding: 0 8px 8px; list-style: none; }
  .list li button { width: 100%; text-align: left; background: none; border: 0; border-radius: 10px; padding: 9px 10px; display: flex; gap: 10px; align-items: center; }
  .list li button:hover, .list li button:focus-visible { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .dot { width: 12px; height: 12px; border-radius: 50%; flex: none; }
  .dist { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .empty { padding: 4px 16px 14px; color: var(--muted); }
  .foot { position: absolute; left: 8px; bottom: 54px; z-index: 1; font-size: 11px; color: var(--muted); background: color-mix(in srgb, var(--card) 85%, transparent); padding: 2px 6px; border-radius: 6px; max-width: 60%; }
  .maplibregl-popup-content { background: var(--card); color: var(--fg); border-radius: 12px; padding: 12px 14px; box-shadow: var(--shadow); max-width: 260px; }
  .maplibregl-popup-tip { border-top-color: var(--card) !important; border-bottom-color: var(--card) !important; }
  .maplibregl-popup-close-button { color: var(--fg); font-size: 18px; }
  .pop h3 { margin: 0 24px 4px 0; font-size: 15px; }
  .pop p { margin: 2px 0; color: var(--muted); font-size: 13px; }
  .pop .links { margin-top: 8px; display: flex; gap: 12px; flex-wrap: wrap; font-size: 13px; }
  .pop a { color: var(--accent); }
  dialog { border: 0; border-radius: 16px; padding: 18px 20px; max-width: min(420px, 92vw); background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog h2 { margin: 0 0 8px; font-size: 17px; }
  dialog p, dialog li { color: var(--muted); }
  dialog .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
  .primary { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 8px 14px; font-weight: 600; text-decoration: none; }
  a { color: var(--accent); }
</style>
</head>
<body>
<div id="map" aria-label="map"></div>

<div class="top">
  <div class="bar">
    <div class="title"><span data-i="title"></span><small id="count"></small></div>
    <button class="icon" id="locate" data-i="near" aria-label="Near me"></button>
    <button class="icon" id="info" aria-label="Info">i</button>
    <button class="icon" id="lang">EN</button>
  </div>
  <div class="chips" id="chips"></div>
  <div class="nudge" id="nudge"><span id="nudgeText"></span><button id="nudgeBtn" data-i="sparseCta"></button></div>
</div>

<button class="fab" id="missing"><span aria-hidden="true">＋</span><span data-i="missing"></span></button>

<div class="foot">© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a></div>

<section class="sheet" id="sheet" aria-live="polite">
  <button class="grab" id="grab"><span id="sheetTitle"></span><span id="chev">▲</span></button>
  <div class="rctl" id="rctl" hidden>
    <div class="rsum" id="rsum"></div>
    <div class="rnote" id="rnote"></div>
    <div class="rbtns"><span data-i="within"></span><span id="rbtns"></span><button class="clear" id="rclear" data-i="clearRoute"></button></div>
  </div>
  <ul class="list" id="list"></ul>
</section>
<input type="file" id="gpxIn" accept=".gpx,application/gpx+xml,text/xml,application/xml" hidden>

<dialog id="mdlg">
  <h2 data-i="missingTitle"></h2>
  <p data-i="missingBody"></p>
  <div class="row"><button class="icon" id="mCancel" data-i="cancel"></button><a class="primary" id="missingGo" target="_blank" rel="noopener" data-i="missingGo"></a></div>
</dialog>

<dialog id="dlg">
  <h2 data-i="aboutTitle"></h2>
  <p data-i="aboutBody"></p>
  <p data-i="aboutSafety"></p>
  <p data-i="aboutMissing"></p>
  <p data-i="privacy"></p>
  <p id="updated"></p>
  <p id="donate" hidden><a id="donateLink" target="_blank" rel="noopener" data-i="donate"></a></p>
  <p id="stats" hidden data-i="statsNote"></p>
  <p><a href="https://github.com/BestCoderEverForSure/greece-water-map/issues" target="_blank" rel="noopener" data-i="feedback"></a></p>
  <div class="row"><button class="primary" id="closeDlg" data-i="ok"></button></div>
</dialog>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script>
"use strict";
// Optional integrations. Fill these in to switch them on (empty = off).
const DONATE_URL = "https://ko-fi.com/turbowater";   // e.g. a Ko-fi or GitHub Sponsors page
const CF_BEACON = "";    // Cloudflare Web Analytics site token (cookie-free visit counter)
const GOATCOUNTER = "";  // your GoatCounter code, e.g. "greece-water" (cookie-free visit counter)
if (CF_BEACON) {
  const cf = document.createElement("script");
  cf.defer = true; cf.src = "https://static.cloudflareinsights.com/beacon.min.js";
  cf.dataset.cfBeacon = JSON.stringify({ token: CF_BEACON });
  document.head.append(cf);
}
if (GOATCOUNTER) {
  const gc = document.createElement("script");
  gc.async = true; gc.src = "https://gc.zgo.at/count.js";
  gc.dataset.goatcounter = `https://${GOATCOUNTER}.goatcounter.com/count`;
  document.head.append(gc);
}
const T = {
  el: {
    title: "Πόσιμο νερό", near: "Κοντά μου", ok: "ΟΚ", missing: "Λείπει βρύση;", directions: "Οδηγίες", donate: "Σου αρέσει ο χάρτης; Κέρασε έναν καφέ ☕", statsNote: "Μετράμε τις επισκέψεις χωρίς cookies και χωρίς προσωπικά στοιχεία.", route: "Διαδρομή GPX", routeTitle: "Κατά μήκος της διαδρομής", within: "Απόσταση:", clearRoute: "Καθαρισμός", routeErr: "Δεν βρέθηκε διαδρομή σε αυτό το αρχείο GPX.", routeNone: "Δεν βρέθηκαν σημεία κοντά στη διαδρομή. Πάρε νερό μαζί σου.", routeNote: "Μετράει μόνο σημεία που ξέρουμε, ίσως υπάρχουν κι άλλα.", routeSum: (len, n, gap) => `${len} χλμ · ${n} σημεία · Μεγαλύτερο διάστημα χωρίς νερό: ${gap} χλμ`, streetView: "Street View", checked: "Τελευταίος έλεγχος", feedback: "Σχόλια ή προβλήματα στη σελίδα", cancel: "Άκυρο", missingGo: "Άνοιγμα σημείωσης", missingTitle: "Λείπει μια βρύση;", missingBody: "Θα ανοίξει μια σημείωση στο OpenStreetMap στο σημείο που βλέπεις τώρα στον χάρτη. Πρώτα μετακίνησε τον χάρτη πάνω στο σημείο. Στη σημείωση γράψε τι είναι (βρύση, κάνουλα, πηγή), πού ακριβώς βρίσκεται και αν τρέχει νερό.", sparse: n => n === 0 ? "Δεν έχουμε κανένα σημείο εδώ. Ξέρεις κάποιο;" : `Μόνο ${n} ${n === 1 ? "σημείο" : "σημεία"} εδώ. Ξέρεις κάποιο που λείπει;`, sparseCta: "Πρόσθεσε", updated: "Δεδομένα από", privacy: "Η τοποθεσία σου και τα αρχεία GPX μένουν στη συσκευή σου και δεν ανεβαίνουν πουθενά.", athens: "Αθήνα", thess: "Θεσσαλονίκη",
    fountain: "Βρύση", tap: "Κάνουλα", spring: "Πηγή", unnamed: "Χωρίς όνομα",
    nearest: "Πιο κοντινές", nearestNone: "Πάτα «Κοντά μου» για να δεις τις πιο κοντινές βρύσες.",
    locating: "Εντοπισμός…", locFail: "Δεν βρέθηκε η τοποθεσία σου. Έλεγξε τα δικαιώματα του browser.",
    noResults: "Δεν βρέθηκε τίποτα κοντά σου με αυτά τα φίλτρα.",
    points: n => n.toLocaleString("el") + " σημεία",
    drinkable: "Νερό", drinkableYes: "σημειωμένο ως πόσιμο", drinkableListed: "καταχωρημένο ως πόσιμο στο OSM, δεν έχει ελεγχθεί", drinkableUnknown: "η ποιότητα δεν αναφέρεται",
    seasonal: "Εποχιακό", fee: "Χρέωση", hours: "Ώρες", note: "Σημείωση",
    viewOsm: "Δες στο OSM", report: "Πρόβλημα / λείπει κάτι;", km: "χλμ", m: "μ",
    aboutTitle: "Για τον χάρτη",
    aboutBody: "Δείχνει βρύσες, κάνουλες και πηγές πόσιμου νερού στην Ελλάδα. Τα δεδομένα είναι από το OpenStreetMap και τα ενημερώνουμε τακτικά. Δεν είναι πλήρη: σε πολλές πόλεις λείπουν σημεία.",
    aboutSafety: "Το νερό δεν είναι εγγυημένα ασφαλές. Οι πληροφορίες είναι από χρήστες του OSM και δεν ελέγχονται από εμάς. Αν δεν είσαι σίγουρος, ρώτα ή πάρε δικό σου νερό.",
    aboutMissing: "Βρήκες μια βρύση που λείπει ή δεν δουλεύει; Πάτα «Πρόβλημα / λείπει κάτι;» σε οποιοδήποτε σημείο, ή δες τη σελίδα OpenStreetMap για να την προσθέσεις.",
  },
  en: {
    title: "Drinking water", near: "Near me", ok: "OK", missing: "Missing a fountain?", directions: "Directions", donate: "Like the map? Buy me a coffee ☕", statsNote: "We count visits without cookies or personal data.", route: "Route (GPX)", routeTitle: "Along the route", within: "Within:", clearRoute: "Clear", routeErr: "No route found in that GPX file.", routeNone: "No points found near this route. Carry water.", routeNote: "Counts only points we know about, more may exist.", routeSum: (len, n, gap) => `${len} km · ${n} points · Longest stretch without water: ${gap} km`, streetView: "Street View", checked: "Last checked", feedback: "Feedback or problems with this page", cancel: "Cancel", missingGo: "Open note", missingTitle: "Missing a fountain?", missingBody: "This opens an OpenStreetMap note at the spot you see on the map now. First move the map onto the spot. In the note, say what it is (fountain, tap, spring), exactly where it is, and whether water flows.", sparse: n => n === 0 ? "No points here yet. Know one?" : `Only ${n} ${n === 1 ? "point" : "points"} here. Know one that's missing?`, sparseCta: "Add", updated: "Data from", privacy: "Your location and GPX files stay on your device and aren't uploaded.", athens: "Athens", thess: "Thessaloniki",
    fountain: "Fountain", tap: "Tap", spring: "Spring", unnamed: "Unnamed",
    nearest: "Nearest", nearestNone: "Tap “Near me” to see the closest fountains.",
    locating: "Locating…", locFail: "Couldn't get your location. Check your browser permissions.",
    noResults: "Nothing found near you with these filters.",
    points: n => n.toLocaleString("en") + " points",
    drinkable: "Water", drinkableYes: "tagged as drinkable", drinkableListed: "listed as drinking water in OSM, not verified", drinkableUnknown: "quality not stated",
    seasonal: "Seasonal", fee: "Fee", hours: "Hours", note: "Note",
    viewOsm: "View on OSM", report: "Problem / missing one?", km: "km", m: "m",
    aboutTitle: "About this map",
    aboutBody: "Shows drinking fountains, taps and springs in Greece. Data is from OpenStreetMap and refreshed regularly. It's incomplete: many towns are missing points.",
    aboutSafety: "Water isn't guaranteed safe. Info comes from OSM users and isn't checked by us. If you're unsure, ask locally or carry your own water.",
    aboutMissing: "Found one that's missing or broken? Tap “Problem / missing one?” on any point, or open OpenStreetMap to add it.",
  },
};
let lang = (navigator.language || "el").toLowerCase().startsWith("el") ? "el" : "en";
try { lang = localStorage.getItem("lang") || lang; } catch (e) {}
const t = k => T[lang][k];

const KINDS = { fountain: "#1478d4", tap: "#0e9384", spring: "#4f9a2a" };
const active = new Set(Object.keys(KINDS));
let data = null, userPos = null, marker = null;

const $ = id => document.getElementById(id);
const sheet = $("sheet");
function setSheet(open) { sheet.classList.toggle("open", open); $("chev").textContent = open ? "▼" : "▲"; }

const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/" + (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "liberty"),
  center: [23.73, 37.98], zoom: 11, hash: true, attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), "bottom-right");
new ResizeObserver(() => map.resize()).observe($("map"));

function haversine(a, b) {
  const R = 6371000, r = Math.PI / 180;
  const dLat = (b[1] - a[1]) * r, dLon = (b[0] - a[0]) * r;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[1] * r) * Math.cos(b[1] * r) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
const fmtDist = d => d < 1000 ? Math.round(d / 10) * 10 + " " + t("m") : (d / 1000).toFixed(d < 10000 ? 1 : 0) + " " + t("km");
const nameOf = p => p["name:" + lang] || p.name || p["name:el"] || p["name:en"] || "";
const labelOf = p => nameOf(p) ? `${t(p.kind)} · ${nameOf(p)}` : t(p.kind);
const visible = f => active.has(f.properties.kind);

function applyFilter() {
  if (!map.getLayer("points")) return;
  const f = ["in", ["get", "kind"], ["literal", [...active]]];
  map.setFilter("points", ["all", ["!", ["has", "point_count"]], f]);
  // Clusters are computed from the source, so rebuild the source with filtered data.
  map.getSource("water").setData({ type: "FeatureCollection", features: data.features.filter(visible) });
  if (route) computeHits();
  renderList();
  $("count").textContent = t("points")(data.features.filter(visible).length);
}

function renderChips() {
  const box = $("chips"); box.textContent = "";
  for (const k of Object.keys(KINDS)) {
    const b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", active.has(k));
    const i = document.createElement("i"); i.style.background = KINDS[k];
    b.append(i, document.createTextNode(t(k)));
    b.onclick = () => { active.has(k) ? active.delete(k) : active.add(k); b.setAttribute("aria-pressed", active.has(k)); applyFilter(); };
    box.append(b);
  }
  for (const [key, center] of [["athens", [23.7275, 37.9838]], ["thess", [22.9444, 40.6401]]]) {
    const b = document.createElement("button");
    b.className = "chip city"; b.textContent = t(key);
    b.onclick = () => map.flyTo({ center, zoom: 13.5 });
    box.append(b);
  }
  const g = document.createElement("button");
  g.className = "chip city"; g.textContent = "\u2934 " + t("route");
  g.onclick = () => $("gpxIn").click();
  box.append(g);
}

function renderList() {
  const ul = $("list"); ul.textContent = "";
  $("rctl").hidden = !route;
  if (route) return renderRouteList(ul);
  $("sheetTitle").textContent = t("nearest");
  if (!userPos) { const p = document.createElement("p"); p.className = "empty"; p.textContent = t("nearestNone"); ul.append(p); return; }
  const near = data.features.filter(visible)
    .map(f => ({ f, d: haversine(userPos, f.geometry.coordinates) })).sort((a, b) => a.d - b.d).slice(0, 12);
  if (!near.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = t("noResults"); ul.append(p); return; }
  for (const { f, d } of near) {
    const li = document.createElement("li"), b = document.createElement("button");
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = KINDS[f.properties.kind];
    const nm = document.createElement("span"); nm.textContent = labelOf(f.properties);
    const ds = document.createElement("span"); ds.className = "dist"; ds.textContent = fmtDist(d);
    b.append(dot, nm, ds); b.onclick = () => { focusOn(f); setSheet(false); };
    li.append(b); ul.append(li);
  }
}

function popupNode(f) {
  const p = f.properties, [lon, lat] = f.geometry.coordinates, div = document.createElement("div");
  div.className = "pop";
  const h = document.createElement("h3"); h.textContent = labelOf(p); div.append(h);
  const line = txt => { const e = document.createElement("p"); e.textContent = txt; div.append(e); };
  line(`${t("drinkable")}: ${p.drinking_water === "yes" ? t("drinkableYes") : p.kind === "fountain" ? t("drinkableListed") : t("drinkableUnknown")}`);
  if (p.seasonal) line(`${t("seasonal")}: ${p.seasonal}`);
  if (p.fee) line(`${t("fee")}: ${p.fee}`);
  if (p.opening_hours) line(`${t("hours")}: ${p.opening_hours}`);
  if (p.check_date) line(`${t("checked")}: ${p.check_date}`);
  if (p.description) line(`${t("note")}: ${p.description}`);
  const links = document.createElement("div"); links.className = "links";
  const mk = (href, txt) => { const a = document.createElement("a"); a.href = href; a.target = "_blank"; a.rel = "noopener"; a.textContent = txt; return a; };
  const kind = p.osm.startsWith("n") ? "node" : "way";
  links.append(mk(`https://www.openstreetmap.org/${kind}/${p.osm.slice(1)}`, t("viewOsm")),
               mk(`https://www.openstreetmap.org/note/new#map=19/${lat}/${lon}`, t("report")));
  div.append(links);
  const dir = document.createElement("a"); dir.className = "dir"; dir.target = "_blank"; dir.rel = "noopener";
  dir.href = `https://www.google.com/maps/dir/?api=1&destination=${lat},${lon}&travelmode=walking`;
  dir.textContent = "→ " + t("directions"); div.append(dir);
  links.append(mk(`https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${lat},${lon}`, t("streetView")));
  return div;
}

function focusOn(f) {
  map.flyTo({ center: f.geometry.coordinates, zoom: Math.max(map.getZoom(), 16) });
  new maplibregl.Popup({ offset: 12 }).setLngLat(f.geometry.coordinates).setDOMContent(popupNode(f)).addTo(map);
}

function locate() {
  const btn = $("locate"); btn.textContent = t("locating");
  navigator.geolocation.getCurrentPosition(pos => {
    btn.textContent = t("near");
    userPos = [pos.coords.longitude, pos.coords.latitude];
    if (marker) marker.remove();
    const el = document.createElement("div");
    el.style.cssText = "width:16px;height:16px;border-radius:50%;background:#e5484d;border:3px solid #fff;box-shadow:0 0 0 2px rgba(229,72,77,.4)";
    marker = new maplibregl.Marker({ element: el }).setLngLat(userPos).addTo(map);
    map.flyTo({ center: userPos, zoom: 15 });
    renderList(); setSheet(true);
  }, () => { btn.textContent = t("near"); alert(t("locFail")); }, { enableHighAccuracy: true, timeout: 10000 });
}

function updateMissingLink() {
  const c = map.getCenter(), z = Math.max(17, Math.round(map.getZoom()));
  $("missingGo").href = `https://www.openstreetmap.org/note/new#map=${z}/${c.lat.toFixed(5)}/${c.lng.toFixed(5)}`;
}
function updateNudge() {
  if (!data || map.getZoom() < 12) { $("nudge").classList.remove("show"); return; }
  const b = map.getBounds(), w = b.getWest(), e = b.getEast(), s = b.getSouth(), n = b.getNorth();
  const inView = data.features.filter(f => { const [x, y] = f.geometry.coordinates; return visible(f) && x >= w && x <= e && y >= s && y <= n; }).length;
  $("nudgeText").textContent = t("sparse")(inView);
  $("nudge").classList.toggle("show", inView < 8);
}
map.on("moveend", () => { updateMissingLink(); updateNudge(); });
updateMissingLink();
const openMissing = () => { updateMissingLink(); $("mdlg").showModal(); };
$("missing").onclick = openMissing;
$("nudgeBtn").onclick = openMissing;
$("mCancel").onclick = () => $("mdlg").close();
$("missingGo").addEventListener("click", () => $("mdlg").close());

// ---- GPX route: draw a route and list the water points along it (all client-side)
let route = null, routeMax = 300, routeHits = [];
const ROUTE_STEPS = [150, 300, 600];

function parseGpx(text) {
  const doc = new DOMParser().parseFromString(text, "application/xml");
  if (doc.querySelector("parsererror")) return null;
  let pts = [...doc.getElementsByTagName("trkpt")];
  if (!pts.length) pts = [...doc.getElementsByTagName("rtept")];
  const coords = pts.map(p => [parseFloat(p.getAttribute("lon")), parseFloat(p.getAttribute("lat"))])
    .filter(c => isFinite(c[0]) && isFinite(c[1]));
  return coords.length >= 2 ? coords : null;
}

function buildRoute(full) {
  const cumFull = [0];
  for (let i = 1; i < full.length; i++) cumFull.push(cumFull[i - 1] + haversine(full[i - 1], full[i]));
  const step = Math.max(1, Math.ceil(full.length / 2500)), coords = [], cum = [];
  for (let i = 0; i < full.length; i += step) { coords.push(full[i]); cum.push(cumFull[i]); }
  if ((full.length - 1) % step) { coords.push(full[full.length - 1]); cum.push(cumFull[full.length - 1]); }
  return { coords, cum, total: cumFull[full.length - 1] };
}

function segDist(p, a, b) {
  const k = Math.cos(p[1] * Math.PI / 180), R = 111320;
  const ax = (a[0] - p[0]) * k * R, ay = (a[1] - p[1]) * R, bx = (b[0] - p[0]) * k * R, by = (b[1] - p[1]) * R;
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 ? -(ax * dx + ay * dy) / l2 : 0; u = Math.max(0, Math.min(1, u));
  return [Math.hypot(ax + u * dx, ay + u * dy), u];
}

function computeHits() {
  const c = route.coords;
  let w = 180, e = -180, s = 90, n = -90;
  for (const [x, y] of c) { w = Math.min(w, x); e = Math.max(e, x); s = Math.min(s, y); n = Math.max(n, y); }
  const dLat = routeMax * 1.2 / 111320, dLon = dLat / Math.cos(((s + n) / 2) * Math.PI / 180);
  routeHits = [];
  for (const f of data.features) {
    if (!visible(f)) continue;
    const p = f.geometry.coordinates;
    if (p[0] < w - dLon || p[0] > e + dLon || p[1] < s - dLat || p[1] > n + dLat) continue;
    let best = Infinity, along = 0;
    for (let i = 0; i < c.length - 1; i++) {
      const [d, u] = segDist(p, c[i], c[i + 1]);
      if (d < best) { best = d; along = route.cum[i] + u * (route.cum[i + 1] - route.cum[i]); }
    }
    if (best <= routeMax) routeHits.push({ f, d: best, along });
  }
  routeHits.sort((a, b) => a.along - b.along);
  const src = map.getSource("routehits");
  if (src) src.setData({ type: "FeatureCollection", features: routeHits.map(h => h.f) });
}

function renderRouteList(ul) {
  $("sheetTitle").textContent = `${t("routeTitle")} (${routeHits.length})`;
  const marks = [0, ...routeHits.map(h => h.along), route.total];
  let gap = 0; for (let i = 1; i < marks.length; i++) gap = Math.max(gap, marks[i] - marks[i - 1]);
  $("rsum").textContent = t("routeSum")((route.total / 1000).toFixed(1), routeHits.length, (gap / 1000).toFixed(1));
  $("rnote").textContent = t("routeNote");
  const box = $("rbtns"); box.textContent = "";
  for (const m of ROUTE_STEPS) {
    const b = document.createElement("button");
    b.textContent = m + " " + t("m"); b.setAttribute("aria-pressed", m === routeMax);
    b.onclick = () => { routeMax = m; computeHits(); renderList(); };
    box.append(b);
  }
  if (!routeHits.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = t("routeNone"); ul.append(p); return; }
  for (const { f, d, along } of routeHits) {
    const li = document.createElement("li"), b = document.createElement("button");
    const dot = document.createElement("span"); dot.className = "dot"; dot.style.background = KINDS[f.properties.kind];
    const nm = document.createElement("span"); nm.textContent = labelOf(f.properties);
    const ds = document.createElement("span"); ds.className = "dist";
    ds.textContent = `${(along / 1000).toFixed(1)} ${t("km")} · ${fmtDist(d)}`;
    b.append(dot, nm, ds); b.onclick = () => { focusOn(f); setSheet(false); };
    li.append(b); ul.append(li);
  }
}

function setRouteOnMap() {
  const line = { type: "Feature", geometry: { type: "LineString", coordinates: route.coords } };
  if (map.getSource("route")) { map.getSource("route").setData(line); return; }
  map.addSource("route", { type: "geojson", data: line });
  map.addSource("routehits", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "route-casing", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#fff", "line-width": 7 } }, "clusters");
  map.addLayer({ id: "route-line", type: "line", source: "route", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#ff6b00", "line-width": 4 } }, "clusters");
  map.addLayer({ id: "route-hits", type: "circle", source: "routehits", paint: { "circle-radius": 12, "circle-color": "rgba(255,107,0,0.18)", "circle-stroke-color": "#ff6b00", "circle-stroke-width": 2.5 } }, "clusters");
}

function loadGpxText(text) {
  const full = parseGpx(text);
  if (!full) { alert(t("routeErr")); return; }
  route = buildRoute(full);
  setRouteOnMap(); computeHits(); renderList(); setSheet(true);
  const b = route.coords.reduce((bb, c) => bb.extend(c), new maplibregl.LngLatBounds(route.coords[0], route.coords[0]));
  map.fitBounds(b, { padding: { top: 120, bottom: 240, left: 40, right: 40 }, maxZoom: 16 });
}

function clearRoute() {
  route = null; routeHits = [];
  for (const id of ["route-hits", "route-line", "route-casing"]) if (map.getLayer(id)) map.removeLayer(id);
  for (const id of ["routehits", "route"]) if (map.getSource(id)) map.removeSource(id);
  renderList();
}

async function handleGpxFile(file) { if (file) loadGpxText(await file.text()); }
$("gpxIn").onchange = e => { handleGpxFile(e.target.files[0]); e.target.value = ""; };
$("rclear").onclick = clearRoute;
addEventListener("dragover", e => { e.preventDefault(); document.body.classList.add("drag"); });
addEventListener("dragleave", () => document.body.classList.remove("drag"));
addEventListener("drop", e => { e.preventDefault(); document.body.classList.remove("drag"); handleGpxFile(e.dataTransfer.files[0]); });

function applyLang() {
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i]").forEach(e => e.textContent = t(e.dataset.i));
  $("lang").textContent = lang === "el" ? "EN" : "ΕΛ";
  if (data) $("updated").textContent = `${t("updated")} OpenStreetMap: ${data.generated || "?"}`;
  updateNudge();
  renderChips(); if (data) { renderList(); $("count").textContent = t("points")(data.features.filter(visible).length); }
}

$("lang").onclick = () => { lang = lang === "el" ? "en" : "el"; try { localStorage.setItem("lang", lang); } catch (e) {} applyLang(); };
$("locate").onclick = locate;
$("info").onclick = () => $("dlg").showModal();
$("closeDlg").onclick = () => $("dlg").close();
$("grab").onclick = () => setSheet(!sheet.classList.contains("open"));

// Fetch the data right away, in parallel with the base map, and draw it as soon as the map style is ready
// (not after every tile has loaded), so slow map tiles never hold the fountains back.
const dataReady = fetch("water.geojson").then(r => r.json());
map.on("style.load", async () => {
  try { data = await dataReady; } catch (e) { $("count").textContent = "\u26A0"; return; }
  map.addSource("water", { type: "geojson", data, cluster: true, clusterRadius: 44, clusterMaxZoom: 14 });
  map.addLayer({ id: "clusters", type: "circle", source: "water", filter: ["has", "point_count"],
    paint: { "circle-color": "#1478d4", "circle-opacity": .85, "circle-stroke-color": "#fff", "circle-stroke-width": 2,
             "circle-radius": ["step", ["coalesce", ["get", "point_count"], 0], 15, 25, 19, 100, 24, 400, 30] } });
  map.addLayer({ id: "cluster-count", type: "symbol", source: "water", filter: ["has", "point_count"],
    layout: { "text-field": ["get", "point_count_abbreviated"], "text-font": ["Noto Sans Bold"], "text-size": 13 },
    paint: { "text-color": "#fff" } });
  map.addLayer({ id: "points", type: "circle", source: "water", filter: ["!", ["has", "point_count"]],
    paint: { "circle-radius": ["interpolate", ["linear"], ["zoom"], 8, 4, 16, 9],
             "circle-color": ["match", ["get", "kind"], "tap", KINDS.tap, "spring", KINDS.spring, KINDS.fountain],
             "circle-stroke-color": "#fff", "circle-stroke-width": 2 } });
  map.on("click", "clusters", e => {
    const f = e.features[0];
    map.getSource("water").getClusterExpansionZoom(f.properties.cluster_id).then(z => map.easeTo({ center: f.geometry.coordinates, zoom: z + .5 }));
  });
  map.on("click", "points", e => focusOn(e.features[0]));
  for (const l of ["clusters", "points"]) {
    map.on("mouseenter", l, () => map.getCanvas().style.cursor = "pointer");
    map.on("mouseleave", l, () => map.getCanvas().style.cursor = "");
  }
  applyFilter(); $("updated").textContent = `${t("updated")} OpenStreetMap: ${data.generated || "?"}`; updateNudge();
});
if (DONATE_URL) { $("donate").hidden = false; $("donateLink").href = DONATE_URL; }
if (GOATCOUNTER || CF_BEACON) $("stats").hidden = false;
applyLang();
</script>
